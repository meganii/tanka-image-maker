<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短歌画像メーカー</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (明朝体) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
    <!-- html2canvas (画像生成用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        .tanka-font {
            font-family: 'Noto Serif JP', serif;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        #result-image {
            user-select: auto;
            -webkit-user-select: auto;
            -webkit-touch-callout: default;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-slate-700">短歌画像メーカー</h1>
            <p class="text-slate-500 mt-2">プレビューを見ながら調整し、SNS用の画像を作成できます。</p>
        </header>

        <!-- 画像出力＆シェア用モーダル -->
        <div id="result-modal"
            class="fixed inset-0 bg-black bg-opacity-75 hidden flex flex-col items-center justify-center z-50 p-4 transition-opacity">
            <div
                class="bg-white rounded-xl w-full max-w-lg max-h-full overflow-hidden flex flex-col relative shadow-2xl">
                <!-- 閉じるボタン -->
                <button id="close-modal-btn"
                    class="absolute top-3 right-3 bg-slate-200 hover:bg-slate-300 rounded-full w-8 h-8 flex items-center justify-center text-slate-700 transition-colors z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <div class="p-4 border-b text-center font-bold text-slate-700">
                    画像が生成されました！
                </div>

                <div class="p-4 flex-1 overflow-auto bg-slate-100 flex items-center justify-center">
                    <img id="result-image" class="max-w-full max-h-[40vh] shadow-md border" src="" alt="生成された短歌画像">
                </div>

                <!-- シェア手順セクション -->
                <div class="p-5 border-t bg-slate-50 space-y-4">

                    <div class="bg-blue-50 text-blue-800 text-sm p-3 rounded-lg border border-blue-100 font-medium">
                        💡 X(Twitter)へ投稿する手順：<br>
                        1. 下の「画像をコピー」を押す<br>
                        2. 「Xの投稿画面を開く」を押す<br>
                        3. 開いた画面で、画像を「ペースト(貼り付け)」する
                    </div>

                    <div class="flex gap-3 justify-center">
                        <button id="copy-btn"
                            class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            <span>画像をコピー</span>
                        </button>

                        <button id="share-twitter-btn"
                            class="flex-1 bg-black hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow opacity-50 cursor-not-allowed"
                            disabled>
                            <!-- X Logo -->
                            <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current">
                                <path
                                    d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.008 5.961H5.078z">
                                </path>
                            </svg>
                            <span>X の投稿画面を開く</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-8 relative">

            <!-- 左側：プレビューエリア -->
            <div class="w-full lg:w-1/2 flex flex-col items-center sticky top-0 z-40 bg-slate-50 pt-2 pb-4 lg:p-0 lg:static">
                <div
                    class="lg:sticky lg:top-8 w-full flex justify-center custom-scrollbar overflow-auto p-4 bg-slate-200 rounded-xl shadow-inner max-h-[50vh] lg:max-h-none">
                    <div id="capture-wrapper" class="shadow-md transition-all duration-300 ease-in-out"
                        style="width: 400px; max-width: 100%;">
                        <div id="capture-area"
                            class="relative flex items-center justify-center overflow-hidden bg-white"
                            style="aspect-ratio: 1 / 1; padding: 2rem;">
                            <div id="tanka-text" class="tanka-font text-slate-900 transition-all"
                                style="font-size: 28px; line-height: 2; letter-spacing: 0.1em;"></div>
                            <div id="signature-text" class="tanka-font absolute text-slate-600 transition-all"
                                style="font-size: 16px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：コントロールパネル -->
            <div class="w-full lg:w-1/2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-8">

                <section>
                    <h2 class="text-lg font-semibold border-b pb-2 mb-4">テキスト入力</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">短歌本文</label>
                            <textarea id="tanka-input" rows="5"
                                class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none resize-y"
                                placeholder="ここに短歌を入力">白鳥は&#10;かなしからずや&#10;空の青&#10;海のあをにも&#10;染まずただよふ</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">署名（筆名やIDなど）</label>
                            <input type="text" id="signature-input" value="若山牧水"
                                class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-lg font-semibold border-b pb-2 mb-4">デザイン設定</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-1">画像サイズ（比率）</label>
                            <select id="ratio-input" class="w-full p-3 border rounded-lg outline-none bg-white">
                                <option value="1 / 1">1:1 (正方形 - Instagram等)</option>
                                <option value="3 / 4">3:4 (縦長 - X推奨)</option>
                                <option value="4 / 3">4:3 (横長)</option>
                                <option value="9 / 16">9:16 (ストーリーズ等)</option>
                                <option value="16 / 9">16:9 (横長ワイド)</option>
                            </select>
                        </div>
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-medium mb-1">背景色</label>
                                <div class="flex items-center gap-2">
                                    <input type="color" id="bg-color-input" value="#ffffff"
                                        class="w-10 h-10 rounded cursor-pointer border-0 p-0">
                                </div>
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-medium mb-1">文字色</label>
                                <div class="flex items-center gap-2">
                                    <input type="color" id="text-color-input" value="#1e293b"
                                        class="w-10 h-10 rounded cursor-pointer border-0 p-0">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-lg font-semibold border-b pb-2 mb-4">フォント・レイアウト調整</h2>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between">
                                <label class="block text-sm font-medium mb-1">文字サイズ</label>
                            </div>
                            <input type="range" id="font-size-input" min="16" max="64" value="28"
                                class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between">
                                <label class="block text-sm font-medium mb-1">行間</label>
                            </div>
                            <input type="range" id="line-height-input" min="1.0" max="4.0" step="0.1" value="2.0"
                                class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between">
                                <label class="block text-sm font-medium mb-1">文字間隔</label>
                            </div>
                            <input type="range" id="letter-spacing-input" min="0" max="1.0" step="0.05" value="0.1"
                                class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between">
                                <label class="block text-sm font-medium mb-1">全体の余白</label>
                            </div>
                            <input type="range" id="padding-input" min="0" max="6" step="0.5" value="2.0"
                                class="w-full accent-blue-500">
                        </div>
                    </div>
                </section>

                <div class="pt-4">
                    <button id="download-btn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span id="download-text">画像を生成する</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const inputs = {
            tanka: document.getElementById('tanka-input'),
            signature: document.getElementById('signature-input'),
            ratio: document.getElementById('ratio-input'),
            bgColor: document.getElementById('bg-color-input'),
            textColor: document.getElementById('text-color-input'),
            fontSize: document.getElementById('font-size-input'),
            lineHeight: document.getElementById('line-height-input'),
            letterSpacing: document.getElementById('letter-spacing-input'),
            padding: document.getElementById('padding-input')
        };

        const preview = {
            area: document.getElementById('capture-area'),
            tanka: document.getElementById('tanka-text'),
            signature: document.getElementById('signature-text')
        };

        const downloadBtn = document.getElementById('download-btn');
        const downloadText = document.getElementById('download-text');

        // モーダル・シェア関連
        const modal = document.getElementById('result-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const resultImage = document.getElementById('result-image');
        const copyBtn = document.getElementById('copy-btn');
        const shareTwitterBtn = document.getElementById('share-twitter-btn');

        closeModalBtn.addEventListener('click', () => modal.classList.add('hidden'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        });

        function updatePreview() {
            preview.tanka.innerHTML = inputs.tanka.value.replace(/\n/g, '<br>');
            preview.signature.innerText = inputs.signature.value;

            preview.area.style.aspectRatio = inputs.ratio.value;
            preview.area.style.backgroundColor = inputs.bgColor.value;
            preview.tanka.style.color = inputs.textColor.value;

            const paddingValue = `${inputs.padding.value}rem`;
            preview.area.style.padding = paddingValue;

            preview.signature.style.right = paddingValue;
            preview.signature.style.bottom = paddingValue;
            preview.signature.style.color = inputs.textColor.value;
            preview.signature.style.opacity = "0.8";

            preview.tanka.style.fontSize = `${inputs.fontSize.value}px`;
            preview.tanka.style.lineHeight = inputs.lineHeight.value;
            preview.tanka.style.letterSpacing = `${inputs.letterSpacing.value}em`;

            const sigSize = Math.max(12, Math.floor(inputs.fontSize.value * 0.55));
            preview.signature.style.fontSize = `${sigSize}px`;
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updatePreview);
            input.addEventListener('change', updatePreview);
        });

        updatePreview();

        // 画像生成処理
        downloadBtn.addEventListener('click', async () => {
            const originalText = downloadText.innerText;
            downloadText.innerText = '生成中...';
            downloadBtn.disabled = true;

            // Xシェアボタンを初期状態に戻す
            shareTwitterBtn.disabled = true;
            shareTwitterBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const canvas = await html2canvas(preview.area, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: inputs.bgColor.value,
                    logging: false
                });

                const dataUrl = canvas.toDataURL('image/png');

                // 本来のダウンロード処理 (ローカル環境用)
                try {
                    const link = document.createElement('a');
                    link.download = `tanka_${new Date().getTime()}.png`;
                    link.href = dataUrl;
                    link.click();
                } catch (e) { }

                // モーダル表示
                resultImage.src = dataUrl;
                modal.classList.remove('hidden');

                // コピーボタンのテキストリセット
                copyBtn.querySelector('span').innerText = "1. 画像をコピー";

            } catch (error) {
                console.error('画像生成に失敗:', error);
                alert('画像の生成に失敗しました。');
            } finally {
                downloadText.innerText = originalText;
                downloadBtn.disabled = false;
            }
        });

        // 1. 画像をクリップボードにコピー
        copyBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(resultImage.src);
                const blob = await response.blob();
                const item = new ClipboardItem({ 'image/png': blob });
                await navigator.clipboard.write([item]);

                // コピー成功UI
                const span = copyBtn.querySelector('span');
                span.innerText = "✅ コピー完了！";

                // 次のステップ(Xボタン)を有効化
                shareTwitterBtn.disabled = false;
                shareTwitterBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                shareTwitterBtn.classList.add('animate-pulse'); // 目立たせる
                setTimeout(() => shareTwitterBtn.classList.remove('animate-pulse'), 2000);

            } catch (err) {
                alert('このブラウザでは画像のコピー機能がブロックされています。画像を右クリック（長押し）して保存してください。');
                // エラーでもXボタンは押せるようにする
                shareTwitterBtn.disabled = false;
                shareTwitterBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // 2. X(Twitter)の投稿画面を開く
        shareTwitterBtn.addEventListener('click', () => {
            // 投稿文面の作成（短歌を1行にして、ハッシュタグを付ける）
            const rawTanka = inputs.tanka.value.replace(/\n/g, ' ');
            const author = inputs.signature.value ? ` / ${inputs.signature.value}` : '';
            const tweetText = `${rawTanka}${author}\n\n#短歌 #短歌画像メーカー`;

            // XのインテントURLを生成
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;

            // 新しいタブで開く
            window.open(twitterUrl, '_blank');
        });
    </script>
</body>

</html>
